name: PR Review

# Claude reviews every pull request, as a formal GitHub review from claude[bot].
# The workflow and the review skill are shared across our repos and maintained
# in PopoverAI/claude-pr-review; this file only calls them. The shared
# workflow skips PRs from forks by people without write access, which is what
# makes it safe to run in this public repo.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: PopoverAI/claude-pr-review/.github/workflows/pr-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
