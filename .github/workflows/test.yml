name: test

on:
  # PR-only by design, matching dotrequirements: we don't gate merges on CI, so
  # a per-merge re-run on main buys only faster detection of stale-base
  # breakage — already surfaced by the next PR's merge-into-main run.
  pull_request:

# Cancel a PR's in-flight run when a newer commit is pushed to the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        # 22: the floor `ai@7` sets (engines >=22) and what the package is
        # exercised on. agent-browser itself asks for 24 but is not run in
        # tests. (dotrequirements pins 24 for Vercel; that reason doesn't
        # apply here.)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        # `prepare` runs `pnpm build`, so the package is compiled here as a
        # side effect. There are no git hooks to suppress: husky was removed
        # with the move to Biome.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # tsconfig.typecheck.json, not the bare tsconfig.json: the build config
        # is scoped to src/ (rootDir + declaration emit), and vitest transpiles
        # tests without typechecking them — so a plain `tsc --noEmit` here
        # checked no test file at all, and a type error in tests/ passed CI.
        # Verified by injecting one and watching it sail through. Found by
        # Codex on PR #8.
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Lint
        # `biome ci` — check-only, never writes, and the command Biome
        # documents for CI. It covers formatting and lint in one pass, so
        # there is no separate format check.
        #
        # It fails on errors and exits 0 on warnings — repo-wide, not just for
        # the cases we like. Biome's recommended preset rates several rules
        # that ESLint failed on as warnings, so biome.json raises
        # noUnusedVariables, noUnusedImports and noExplicitAny back to error
        # to keep the gate as strong as it was under tseslint. Anything still
        # at warn level (the `!` assertions in tests/) genuinely does not
        # block. Keep this green — a red-on-arrival gate trains everyone to
        # ignore red.
        run: pnpm lint

      - name: The alias matches the release
        # A version bump must move agentic-demo with it (see CLAUDE.md →
        # Releases). Checked here so a mismatch fails the PR, not the publish
        # after merge; publish.yml checks again.
        run: .github/scripts/check-versions.sh
